<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b1a">
<title>Forma Certa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <button id="home" title="Voltar ao nível 1" aria-label="Voltar ao nível 1">⌂</button>
    <h1>FORMA<span>CERTA</span></h1>
    <div class="info"><span id="lvlTxt">Nível 1</span><b id="badge">1/6</b></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <svg id="board" xmlns="http://www.w3.org/2000/svg" aria-label="Tabuleiro"></svg>
  <footer>
    <button id="bRot">Girar</button>
    <button id="bFlip">Espelhar</button>
    <button id="bHint">Dica</button>
    <button id="bNew">Nova forma</button>
    <span id="moves">Jogadas: 0</span>
  </footer>
  <div id="win" class="hidden">
    <div class="box"><h2 id="winT">Forma certa!</h2><p id="winP"></p><button id="bNext">Próximo nível</button></div>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
